name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Engine/dataset-backed suites skip themselves when the engine binary and dataset are absent;
      # unit tests (command templates, DNA, metrics) always run.
      - run: npm test
      - name: tool schemas are up to date
        run: node dist/tools/dump-schemas.js && git diff --exit-code schemas
  engine:
    # Integration suites against the default engine: F (EX-CT/eve-dogma, crate eve-cli, binary eve-fit) built natively from the commit pinned in
    # engines.lock, on the latest EX-CT/eve-sde-pipeline dataset (compiled into F and indexed by the MCP).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: Pinned engine (engines.lock)
        run: grep -E '^[A-Z0-9_]+=[^[:space:]#]+$' engines.lock | tee -a "$GITHUB_ENV"
      - name: Dataset from the SDE pipeline release
        run: |
          TAG=$(gh release view -R EX-CT/eve-sde-pipeline --json tagName --jq .tagName)
          gh release download "$TAG" -R EX-CT/eve-sde-pipeline -D "$RUNNER_TEMP/data" -p 'dataset-*.json.gz'
          echo "EVE_DOGMA_DATASET=$(ls "$RUNNER_TEMP"/data/dataset-*.json.gz)" >> "$GITHUB_ENV"
          echo "dataset: $TAG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-f-${{ env.VARIANT_F_SHA }}
      - name: Build engine F (native eve-fit, as in the README install)
        run: |
          cargo install --locked --root "$RUNNER_TEMP/f" --git "https://github.com/$VARIANT_F_REPO" --rev "$VARIANT_F_SHA" "$VARIANT_F_PACKAGE"
          echo "EVE_DOGMA_BIN=$RUNNER_TEMP/f/bin/eve-fit" >> "$GITHUB_ENV"
          echo "engine: $VARIANT_F_REPO@$VARIANT_F_SHA ($VARIANT_F_PACKAGE, binary eve-fit)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: npm test (unit + integration on eve-fit; the engine suites must run, only variant C ones may skip)
        run: |
          npm test 2>&1 | tee test.log
          grep -q '^# fail 0' test.log
          if grep -qE 'SKIP (engine|dataset)|engine or dataset missing|dataset missing' test.log; then echo "engine/dataset suites skipped"; exit 1; fi
          grep -E '^# (tests|pass|fail|skipped)' test.log >> "$GITHUB_STEP_SUMMARY"
